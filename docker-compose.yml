services:
  # Ensure your DATABASE_URL uses 'postgresql' as the hostname ie. postgresql://127.0.0.1:5432/your-database-name
  postgres:
    restart: always
    image: postgres:latest
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: appuser
      POSTGRES_DB: iopenservices-com
      POSTGRES_HOST_AUTH_METHOD: trust

volumes:
  pgdata:
  # data:
  node_modules:
